# 1. Habilitar acceso FTP anónimo
# Permite a usuarios sin cuenta acceder al servidor FTP
anonymous_enable=YES

# 2. Deshabilitar acceso a usuarios locales
# Evita que los usuarios del sistema puedan autenticarse por FTP
local_enable=NO

# 3. Permisos de escritura globales
# Se deshabilita cualquier tipo de escritura en el servidor
write_enable=NO

# 4. Permisos de escritura para usuarios anónimos
# Los usuarios anónimos solo podrán descargar archivos
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO

# 5. Límite máximo de conexiones simultáneas
# Número máximo de clientes conectados al servidor FTP
max_clients=200

# 6. Límite de ancho de banda para usuarios anónimos
# Velocidad máxima de descarga en bytes por segundo (50 KB/s)
anon_max_rate=51200

# 7. Tiempo máximo de inactividad
# Las sesiones inactivas durante más de 30 segundos se cerrarán
idle_session_timeout=30

# 8. Modo de funcionamiento del servidor
# Servidor FTP en modo standalone (independiente)
listen=YES
listen_ipv6=NO

# 9. Directorio raíz para usuarios anónimos
# Define el directorio al que accederán los usuarios anónimos
anon_root=/srv/ftp

# 10. Mensaje de bienvenida global
# Se muestra al conectarse al servidor FTP
ftpd_banner=Mirror de Opensuse para 'sistema.sol'

# 11. Mensaje informativo en directorios
# Habilita la lectura del archivo .message en el directorio raíz
dirmessage_enable=YES

# 12. Modo pasivo
# Permite el uso del modo pasivo para compatibilidad con clientes FTP
pasv_enable=YES