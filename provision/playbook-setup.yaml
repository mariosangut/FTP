# ======================================================
# SERVERS CONFIGURATION
# ======================================================

- name: TASK 1. GLOBAL CONFIGURATION
  hosts: servers
  become: true
  tasks:
    - name: Synchronize system time
      ansible.builtin.command: timedatectl set-timezone Europe/Madrid
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install vsftpd
      ansible.builtin.apt:
        name: vsftpd
        state: present

    - name: Install ftp (client)
      ansible.builtin.apt:
        name: ftp
        state: present

# ======================================================
# SERVER 1 CONFIGURATION
# ======================================================

- name: TASK 2. ANONYMOUS FTP
  hosts: anonymous 
  become: true
  tasks: 
    - name: vsftpd config
      ansible.builtin.copy:
        src: ../files/anonymous/vsftpd.conf 
        dest: /etc/vsftpd.conf
        owner: root
        group: root
        mode: '0640'
        backup: true
    
    - name: Create directory
      ansible.builtin.file:
        path: /srv/ftp
        state: directory
        owner: root
        group: ftp
        mode: '0755'

    - name: Message
      ansible.builtin.copy:
        src: ../files/anonymous/.message
        dest: /srv/ftp/.message
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Restart service
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted

# ======================================================
# SERVER 2 CONFIGURATION
# ======================================================      

- name: TASK 3. SECURE FTP
  hosts: secure
  become: true
  tasks: 
    - name: Verify ftp system user exists
      ansible.builtin.command: getent passwd ftp
      register: ftp_user
      changed_when: false

    - name: Show ftp user
      ansible.bultin.debug: 
        var: ftp_user.stdout

    - name: Verify ftp group
      ansible.builtin.command: getent group ftp
      register: ftp_group
      changed_when: false

    - name: Show ftp group
      ansible.bultin.debug: 
        var: ftp_group.stdout

    - name: Check permission /srv/ftp
      ansible.builtin.stat:
        path: /srv/ftp
      register: srv_ftp

    - name: Show permission /srv/ftp
      ansible.builtin.debug:
        msg:
          - "Owner: {{ srv_ftp.stat.pw_name }}"
          - "Group: {{ srv_ftp.stat.gr_name }}"
          - "Permisos: {{ srv_ftp.stat.mode }}"

    - name: List system users without FTP access
      ansible.builtin.command: >
        awk -F: '$7 ~ /(nologin|false)$/ { print $1 }' /etc/passwd
      register: no_ftp_users
      changed_when: false

    - name: Show system users without FTP access
      ansible.builtin.debug:
        var: no_ftp_users.stdout_lines